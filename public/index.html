<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0B429">
<title>Almoxarifado — Painel</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🧰</div>
      <div class="brand-text">
        <h1>Almoxarifado</h1>
        <span id="userTag"></span>
      </div>
    </div>
    <div class="top-actions">
      <select class="site-select mono" id="siteSelect" aria-label="Almoxarifado"></select>
      <a class="icon-btn" href="app.html" title="Abrir app do celular">📱<span class="lbl-wide">App celular</span></a>
      <button class="icon-btn" id="logoutBtn" title="Sair">⎋<span class="lbl-wide">Sair</span></button>
    </div>
  </header>

  <div class="shell">
    <nav class="tabbar" id="tabbar">
      <button class="tab-btn" data-tab="painel"><span class="ic">🏠</span><span>Painel</span><span class="tab-count" id="alertCount" hidden></span></button>
      <button class="tab-btn" data-tab="escanear"><span class="ic">🔎</span><span>Escanear</span></button>
      <button class="tab-btn" data-tab="ferramentas"><span class="ic">🧰</span><span>Ferramentas</span></button>
      <button class="tab-btn" data-tab="funcionarios"><span class="ic">👷</span><span>Funcionários</span></button>
      <button class="tab-btn" data-tab="etiquetas"><span class="ic">🏷️</span><span>Etiquetas</span></button>
      <button class="tab-btn" data-tab="historico"><span class="ic">🕓</span><span>Histórico</span></button>
      <button class="tab-btn" data-tab="fornecedores"><span class="ic">🚚</span><span>Fornecedores</span></button>
      <button class="tab-btn" data-tab="auditoria" id="tabAuditoria" hidden><span class="ic">🛡️</span><span>Auditoria</span></button>
    </nav>

    <main class="main">
      <div id="demoBanner" class="demo-banner" hidden>
        Modo demonstração — os dados ficam só neste navegador. Configure SUPABASE_URL e SUPABASE_ANON_KEY no Render para usar o banco real.
      </div>
      <section id="view-painel"></section>
      <section id="view-escanear" hidden></section>
      <section id="view-ferramentas" hidden></section>
      <section id="view-funcionarios" hidden></section>
      <section id="view-etiquetas" hidden></section>
      <section id="view-historico" hidden></section>
      <section id="view-fornecedores" hidden></section>
      <section id="view-auditoria" hidden></section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="vendor/read-excel-file.min.js"></script>
<script src="vendor/write-excel-file.min.js"></script>
<script src="js/core.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
