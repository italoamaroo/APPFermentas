<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0B429">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Almoxarifado">
<title>Almoxarifado — App</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .main{ max-width:520px; }
  .tabbar{ justify-content:center; }
  @media (min-width:860px){ .shell{ flex-direction:column; } .tabbar{ position:fixed; top:auto; bottom:0; left:0; right:0; width:auto; height:auto; flex-direction:row; border-right:none; border-top:1px solid var(--line); padding:6px; }
    .tab-btn{ flex-direction:column; justify-content:center; font-size:11px; max-width:160px; } .main{ padding-bottom:110px; } .tab-count{ position:absolute; } }
  .scan-wrap{ aspect-ratio:1/1; }
  .tool-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .tool-head .name{ font-family:"Oswald"; font-size:20px; line-height:1.15; }
</style>
</head>
<body>
<div class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🧰</div>
      <div class="brand-text"><h1>Almoxarifado</h1><span id="userTag"></span></div>
    </div>
    <div class="top-actions">
      <a class="icon-btn" href="index.html" title="Painel completo">🖥️</a>
      <button class="icon-btn" id="logoutBtn" title="Sair">⎋</button>
    </div>
  </header>
  <div class="shell">
    <main class="main">
      <div id="demoBanner" class="demo-banner" hidden>Modo demonstração — dados só neste aparelho.</div>
      <section id="view-scan"></section>
      <section id="view-uso" hidden></section>
    </main>
    <nav class="tabbar" id="tabbar">
      <button class="tab-btn" data-tab="scan"><span class="ic">📷</span><span>Escanear</span></button>
      <button class="tab-btn" data-tab="uso"><span class="ic">🧰</span><span>Em uso</span><span class="tab-count" id="alertCount" hidden></span></button>
    </nav>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
